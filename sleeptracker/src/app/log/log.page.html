<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Log Sleep</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Two interactable cards to select which category to log, pop with modal to enter data -->
<ion-content>
  <div class="card-container">
    <ion-card button="true" id="open-sleepy">
      <ion-card-content>
        <ion-card-title>Sleepiness</ion-card-title>
        <ion-icon class="flash" name="flash-off-outline"></ion-icon>
      </ion-card-content>
    </ion-card>

    <ion-card button="true" id="open-overnight">
      <ion-card-content> 
        <ion-card-title>Overnight Sleep</ion-card-title>
        <ion-icon class="bed" name="bed-outline"></ion-icon>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<!-- Modal pop-up for sleepiness-->
<ion-modal #sleepinessModal trigger="open-sleepy" (didDismiss) = "didDismissSleepy()">
  <ng-template>
  <ion-header>
    <ion-toolbar>
      <ion-title>Log Sleepiness</ion-title>
    </ion-toolbar>
  </ion-header>

    <ion-content class = "ion-padding">
      <h2>How sleepy are you?</h2>
      <h4>1 being from most alert to 7 being on the verge of falling asleep</h4>
      <div class = "scale">
        @for (num of scale; track num) {
          <ion-button [fill] = "selectednum == num ? 'solid' : 'outline'" (click) = "selectednum = num">
          {{ num }}
        </ion-button>
    }
    </div>
    <div class = "actions">
      <ion-button (click) = "cancel()">Cancel</ion-button>
      <ion-button [disabled] = "selectednum == null" (click)="confirm()">
        Confirm
      </ion-button>
    </div>
    </ion-content>
  </ng-template>
</ion-modal>

<!-- Modal pop-up for Overnight Sleep-->
<ion-modal #overnightModal trigger="open-overnight" (didDismiss) = "didDismissOvernightSleep()">
  <ng-template>
  <ion-header>
    <ion-toolbar>
      <ion-title>Log Overnight Sleep</ion-title>
    </ion-toolbar>
  </ion-header>

    <ion-content class = "ion-padding">
      <h2>Enter Bedtime:</h2>
      <ion-datetime-button datetime="bedtimePicker"></ion-datetime-button>
      <ion-popover [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime presentation="date-time" id="bedtimePicker" [(ngModel)]="bedtime" [showDefaultButtons]="true"></ion-datetime>
        </ng-template>
      </ion-popover>
      <h2>Enter Wake-Up Time:</h2>
      <ion-datetime-button datetime="waketimePicker"></ion-datetime-button>
      <ion-popover [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime presentation="date-time" id="waketimePicker" [(ngModel)]="waketime" [showDefaultButtons]="true"></ion-datetime>
        </ng-template>
      </ion-popover>
    <div class = "actions">
      <ion-button (click) = "cancelovernight()">Cancel</ion-button>
      <ion-button (click)="confirmovernight()">
        Confirm
      </ion-button>
    </div>
    </ion-content>
  </ng-template>
</ion-modal>
