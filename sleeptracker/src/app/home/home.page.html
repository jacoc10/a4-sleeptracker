<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      SleepTracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="card-container">
    <ion-card>
      <ion-card-header class="sleepiness">
        <ion-icon name="flash-off-outline"></ion-icon>
        <ion-card-title>Amount of Saved Sleepiness Records: </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <h1 class="sleepy-count"> {{ numOfSleepinessRecords }} </h1>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header class="overnight">
        <ion-icon name="bed-outline"></ion-icon>
        <ion-card-title>Amount of Saved Overnight Sleep Records: </ion-card-title>
      </ion-card-header>
      <ion-card-content> 
        <h1 class="overnight-count"> {{ numOfOvernightRecords }} </h1>
      </ion-card-content>
    </ion-card>
  </div>

    <ion-card>
      <ion-card-content> 
        <ion-card-title class="footer">
          Total Amount of Saved Records: {{ numOfRecords }}
        </ion-card-title>
      </ion-card-content>
    </ion-card>
</ion-content>
